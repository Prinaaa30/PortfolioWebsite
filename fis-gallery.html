<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Forensic Investigation System Gallery
</title>


<style>

body{

font-family:Arial,sans-serif;

background:#020617;

color:white;

padding:40px;

}


h1{

text-align:center;

margin-bottom:40px;

}


.gallery{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(350px,1fr));

gap:25px;

}


.gallery img{

width:100%;

border-radius:18px;

border:1px solid rgba(56,189,248,.4);

transition:.3s;

}


.gallery img:hover{

transform:scale(1.03);

}


</style>

</head>
